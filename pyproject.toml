[project]
name = "ipsep-cola"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "itochs", email = "halglobe0108@gmail.com" }]
dependencies = [
    "numpy>=1.26.4",
    "networkx>=3.2.1",
    "scipy>=1.16.0",
    "matplotlib>=3.8.3",
    "pyqt5>=5.15.11",
    "maturin>=1.7.0",
    "pip>=24.2",
    "ruff>=0.12.3",
    "egraph",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "matplotlib-fontja>=1.1.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[project.optional-dependencies]
dev = ["snakeviz>=2.2.0"]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
egraph = { workspace = true, editable = true }

[tool.uv.workspace]
members = [
    "package/core",
    "package/plotting",
    "cli",
    "egraph-rs/crates/python",
    "package/util",
]
